name: SmartBusiness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend restore, format, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartBusiness.slnx

      - name: Check formatting
        run: dotnet format SmartBusiness.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SmartBusiness.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/SmartBusiness.Api.Tests/SmartBusiness.Api.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/SmartBusiness.Api.Tests/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend install, lint, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

  containers:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file backend/SmartBusiness.Api/Dockerfile --tag smartbusiness-api:ci backend

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag smartbusiness-frontend:ci frontend
